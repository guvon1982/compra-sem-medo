# Workflow do GitHub Actions que valida toda Pull Request aberta
# contra `develop` ou `main`. Roda lint, testes e build em Node 24
# (mesma versao do container de desenvolvimento).

name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  checks:
    name: Lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configura Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instala dependencias (npm ci)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes (Vitest)
        run: npm run test:run

      - name: Build de producao
        run: npm run build
